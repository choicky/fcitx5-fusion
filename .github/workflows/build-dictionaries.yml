name: Build and release dictionaries

on:
  pull_request:
    paths:
      - '.github/workflows/build-dictionaries.yml'
      - 'tools/dict-builder/**'
      - 'docs/phase5a-dictionary-evidence.md'
      - 'docs/phase5b-dictionary-build.md'
  workflow_dispatch:
  push:
    tags:
      - 'dictionary-v*'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned-toolchain build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake extra-cmake-modules gettext git libboost-dev libboost-iostreams-dev libzstd-dev pkg-config python3 zstd
      - name: Build pinned Fcitx5 and LibIME
        run: |
          tools/dict-builder/build-libime.sh --manifest tools/dict-builder/manifest.json --source-root /tmp --prefix /tmp/moqi-pinned-libime
      - name: Build twice from fixed inputs
        run: |
          python3 tools/dict-builder/build.py --manifest tools/dict-builder/manifest.json --toolchain-manifest /tmp/moqi-pinned-libime/toolchain.json --pinyindict /tmp/moqi-pinned-libime/bin/libime_pinyindict --output /tmp/dictionary-build-1 --source-root /tmp
          python3 tools/dict-builder/build.py --manifest tools/dict-builder/manifest.json --toolchain-manifest /tmp/moqi-pinned-libime/toolchain.json --pinyindict /tmp/moqi-pinned-libime/bin/libime_pinyindict --output /tmp/dictionary-build-2 --source-root /tmp
          for name in /tmp/dictionary-build-1/*.dict /tmp/dictionary-build-1/*.LICENSE /tmp/dictionary-build-1/SHA256SUMS /tmp/dictionary-build-1/index.json; do
            name="$(basename "$name")"
            cmp "/tmp/dictionary-build-1/$name" "/tmp/dictionary-build-2/$name"
          done
      - name: Run converter and repository checks
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tools/dict-builder -p 'test_*.py' -v
          git diff --check
      - name: Prepare validation artifact
        run: |
          mkdir release
          cp /tmp/dictionary-build-1/*.dict /tmp/dictionary-build-1/*.LICENSE /tmp/dictionary-build-1/SHA256SUMS /tmp/dictionary-build-1/index.json release/
          (cd release && sha256sum -c SHA256SUMS)
          test -s release/rime-frost.dict
          test -s release/rime-wanxiang.dict
      - name: Prepare build audit artifact
        run: |
          mkdir audit
          cp /tmp/moqi-pinned-libime/toolchain.json audit/
          cp /tmp/dictionary-build-1/{audit.json,index.json,SHA256SUMS} audit/
          cp /tmp/dictionary-build-1/*.convert.log /tmp/dictionary-build-1/*.compile.log /tmp/dictionary-build-1/*.roundtrip.log /tmp/dictionary-build-1/*.rejected.tsv audit/
      - uses: actions/upload-artifact@v4
        with:
          name: fcitx5-moqi-dictionaries-${{ github.sha }}
          path: release/
      - uses: actions/upload-artifact@v4
        with:
          name: fcitx5-moqi-dictionary-audit-${{ github.sha }}
          path: audit/

  release:
    if: startsWith(github.ref, 'refs/tags/dictionary-v')
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fcitx5-moqi-dictionaries-${{ github.sha }}
          path: release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
