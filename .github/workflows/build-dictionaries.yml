name: Build and release dictionaries

on:
  workflow_dispatch:
  push:
    tags:
      - 'dictionary-v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3 zstd libime-bin
          command -v libime_pinyindict
      - name: Build twice from fixed inputs
        run: |
          python3 tools/dict-builder/build.py --output /tmp/dictionary-build-1 --source-root /tmp
          python3 tools/dict-builder/build.py --output /tmp/dictionary-build-2 --source-root /tmp
          for name in rime-frost.dict rime-wanxiang.dict rime-frost.LICENSE rime-wanxiang.LICENSE SHA256SUMS index.json; do
            cmp "/tmp/dictionary-build-1/$name" "/tmp/dictionary-build-2/$name"
          done
      - name: Run converter and repository checks
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tools/dict-builder -p 'test_*.py' -v
          git diff --check
      - name: Prepare release bundle
        run: |
          mkdir release
          cp /tmp/dictionary-build-1/{rime-frost.dict,rime-wanxiang.dict,rime-frost.LICENSE,rime-wanxiang.LICENSE,SHA256SUMS,index.json} release/
          (cd release && sha256sum -c SHA256SUMS)
          test -s release/rime-frost.dict
          test -s release/rime-wanxiang.dict
      - uses: actions/upload-artifact@v4
        with:
          name: fcitx5-moqi-dictionaries
          path: release/
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/dictionary-v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
